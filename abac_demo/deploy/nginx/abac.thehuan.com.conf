# Mẫu Nginx cho abac.thehuan.com
# Copy lên VPS: sudo cp deploy/nginx/abac.thehuan.com.conf /etc/nginx/sites-available/abac.thehuan.com.conf
# Sau certbot (HTTPS): thêm block location bên dưới vào CẢ server { listen 443 ssl; ... } — xem deploy/nginx/timeout-api.snippet

server {
    listen 80;
    server_name abac.thehuan.com;

    # Benchmark PDP + load test TPS/P95 có thể chạy vài phút — timeout mặc định ~60s → HTTP 504
    # Gunicorn: --timeout 900 (deploy/systemd/abac-demo.service.example)
    location ~ ^/api/(performance|loadtest)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
