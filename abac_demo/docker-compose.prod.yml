version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abac_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../ABAC_System_Prototype.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 app:app
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-abac_demo}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FLASK_DEBUG: "false"
      # Bảo mật (không đăng nhập): khuyến nghị đặt khóa dài ngẫu nhiên; UI gửi X-Abac-Admin-Token khi Bật/Tắt chính sách
      ABAC_ADMIN_TOKEN: ${ABAC_ADMIN_TOKEN:-}
      # Sau reverse proxy Nginx: ABAC_TRUST_PROXY=1
      ABAC_TRUST_PROXY: ${ABAC_TRUST_PROXY:-}

volumes:
  pgdata:
